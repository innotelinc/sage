name: Mintmark iOS TestFlight

# TestFlight needs macOS and Xcode, which this project does not have: the build
# runs on a GitHub macOS runner and uploads itself. The web app is wrapped in a
# Capacitor shell first, so the phone runs the same bundle the Worker serves.
#
# Signing reuses the estate's App Store Connect credentials, already stored in
# this repository for Sage:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY  (API key: signing + upload)
#   IOS_DIST_P12, IOS_DIST_P12_PASSWORD                        (the distribution identity)
#
# The certificate is imported into a throwaway keychain so every run signs with
# the same identity. Letting Xcode mint one per run is what fills the team's
# certificate cap and then fails with "Choose a certificate to revoke".
#
# Repository variable:
#   MINTMARK_API_URL  the deployed Worker origin, e.g. https://mintmark.example.workers.dev
#                     (baked into the app at build time, so it must be https and live)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: CFBundleShortVersionString for this build — App Store Connect will not take a second build under a version already in review
        type: string
        default: '1.0'
  push:
    tags:
      - 'mintmark-ios-v*'

concurrency:
  group: mintmark-ios-testflight
  cancel-in-progress: false

defaults:
  run:
    working-directory: mintmark

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      API_URL: ${{ vars.MINTMARK_API_URL }}
      BUNDLE_ID: us.inotel.mintmark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mintmark/package-lock.json

      - name: Check the API origin
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::MINTMARK_API_URL is not set. Add the deployed Worker origin as a repository variable (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::MINTMARK_API_URL must be an https origin"; exit 1 ;;
          esac
          echo "the app will call $API_URL"

      - name: Install ASC API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "ASC_KEY_ID / ASC_PRIVATE_KEY secrets are missing"; exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import the distribution certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_DIST_P12" ] || [ -z "$IOS_DIST_P12_PASSWORD" ]; then
            echo "IOS_DIST_P12 / IOS_DIST_P12_PASSWORD secrets are missing"; exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/mintmark-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$IOS_DIST_P12" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/distribution.p12"
          echo "=== signing identities available to this run:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Fail in seconds rather than after a ten-minute archive: the bundle id is
      # registered here if it is missing, and a missing app record stops the run
      # with the exact App Store Connect step that fixes it.
      - name: Preflight App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node deploy/ios/preflight.mjs

      - name: Build the web app
        env:
          VITE_API_BASE_URL: ${{ vars.MINTMARK_API_URL }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/client/index.html
          echo "web bundle: $(du -sh dist/client | cut -f1)"

      - name: Configure the Capacitor project
        run: |
          cp deploy/ios/capacitor.config.json capacitor.config.json
          npm install --no-audit --no-fund --no-save @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          npx cap sync ios
          grep -q '"appId": "us.inotel.mintmark"' capacitor.config.json
          ls -1 ios/App
          # The bundle is served from capacitor://localhost, so a relative /api call
          # would never leave the WebView. Prove the deployment origin was baked in.
          if ! grep -rq "$API_URL" ios/App/App/public/assets; then
            echo "::error::the built bundle does not reference $API_URL — VITE_API_BASE_URL did not reach the build"
            exit 1
          fi

      - name: Install the app icon
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$(dirname "$ICONSET")"
          rm -rf "$ICONSET"
          cp -R deploy/ios/AppIcon.appiconset "$ICONSET"
          echo "icon slots: $(ls -1 "$ICONSET"/*.png | wc -l)"
          # An upload is rejected if the 1024 marketing icon carries alpha.
          if sips -g hasAlpha "$ICONSET/AppIcon-1024x1024@1x.png" | grep -q "hasAlpha: yes"; then
            echo "AppIcon-1024x1024@1x.png has an alpha channel"; exit 1
          fi

      - name: Merge usage descriptions into Info.plist
        env:
          IOS_MARKETING_VERSION: ${{ inputs.marketing_version || '1.0' }}
        run: |
          PLIST=ios/App/App/Info.plist
          set_key() { /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null \
                      || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"; }
          set_key NSCameraUsageDescription "Mintmark uses the camera to photograph the front of a coin you want appraised."
          set_key NSPhotoLibraryUsageDescription "Mintmark reads a photo of a coin you choose, so it can appraise it."
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"
          set_key CFBundleShortVersionString "$IOS_MARKETING_VERSION"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      - name: Install native dependencies
        run: |
          # Capacitor 7 shipped a Podfile; Capacitor 8 moved iOS to Swift Package
          # Manager and has none. Support both instead of assuming CocoaPods.
          if [ -f ios/App/Podfile ]; then
            echo "CocoaPods project - running pod install"
            pod install --project-directory=ios/App
          else
            echo "No Podfile - SPM-based project, xcodebuild resolves packages"
          fi

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then echo "APPLE_TEAM_ID secret is missing"; exit 1; fi
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER="-workspace ios/App/App.xcworkspace"
          else
            CONTAINER="-project ios/App/App.xcodeproj"
          fi
          echo "building with $CONTAINER"
          xcodebuild \
            $CONTAINER \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mintmark.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            archive

      - name: Verify the app bundle
        run: |
          APP=build/Mintmark.xcarchive/Products/Applications/App.app
          test -d "$APP"
          ICONS=$(ls -1 "$APP" | grep -i '^AppIcon' | wc -l | tr -d ' ')
          echo "compiled app icon resources: $ICONS"
          test "$ICONS" -ge 1 || { echo "no AppIcon resources were compiled into the app"; exit 1; }
          test -f "$APP/Assets.car"
          test -f "$APP/capacitor.config.json" || { echo "the Capacitor config did not reach the app bundle"; exit 1; }
          grep -q '"appId": "us.inotel.mintmark"' "$APP/capacitor.config.json"
          test -f "$APP/public/index.html" || { echo "the web bundle did not reach the app"; exit 1; }
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "bundle $BUNDLE $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          test "$BUNDLE" = "us.inotel.mintmark" || { echo "unexpected bundle id $BUNDLE"; exit 1; }

      - name: Export .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed -i '' "s/REPLACE_TEAM_ID/${APPLE_TEAM_ID}/" deploy/ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Mintmark.xcarchive \
            -exportOptionsPlist deploy/ios/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose

      - name: Keep the archive for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintmark-ios-archive
          path: |
            mintmark/build/Mintmark.xcarchive
            mintmark/build/ipa
          if-no-files-found: warn
