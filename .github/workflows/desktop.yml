name: Desktop (Windows)

# Builds the Electron shell and the Windows installer with no signing
# certificate: electron-builder produces an unsigned portable .exe and an NSIS
# installer, which Windows will warn about on first run (More info -> Run anyway).
#
# Actions -> Desktop (Windows) -> Run workflow, or push a tag app-v*.

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable exe and installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --publish never

      - name: Show what was built
        run: Get-ChildItem -Recurse dist/desktop -Filter *.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: sage-windows
          path: dist/desktop/*.exe
          if-no-files-found: error
