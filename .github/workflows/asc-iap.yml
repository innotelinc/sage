name: App Store Connect · session products

# The App Store Connect key is a repository secret, and GitHub never reads a secret
# back out. So the one-time product setup runs here rather than on a workstation.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the products for review (the first consumable needs an app version in the submission)
        type: boolean
        default: false
      probe:
        description: Ask Apple what the Duo and Watch slots expect
        type: boolean
        default: false
      iap_status:
        description: Print each session product's state, version state and territory availability (read-only)
        type: boolean
        default: false
      release_check:
        description: Fail when the build attached to the version is older than the newest valid build (read-only)
        type: boolean
        default: false
      creative:
        description: Upload the header and search result creative into the asset library
        type: boolean
        default: false
      reshoot:
        description: Replace the screenshots even when the count is unchanged
        type: boolean
        default: false
      listing:
        description: Fill the 1.0 listing, category, privacy URL, review contact and screenshots, then add the version to the draft
        type: boolean
        default: false
      attach:
        description: Attach the newest valid build to version 1.0 and add that version to the open submission
        type: boolean
        default: false
      withdraw:
        description: Take version 1.0 out of review so a newer build can be attached
        type: boolean
        default: false
      publish:
        description: Submit the draft to App Review — the step that actually publishes
        type: boolean
        default: false
      certs:
        description: Certificates on this team — `list`, or `purge-dev` to delete the development ones (distribution is never touched)
        type: string
        default: ''
      testflight:
        description: TestFlight builds — `list`, or `expire-old` (every 1.1 build, and every 1.0 but the one version 1.0 holds)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create, price and localise the three session products
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: us.innotel.sage
          IAP_SCREENSHOT: deploy/ios/iap-review.png
          SUBMIT: ${{ inputs.submit }}
          ATTACH: ${{ inputs.attach }}
          LISTING: ${{ inputs.listing }}
          WITHDRAW: ${{ inputs.withdraw }}
          PUBLISH: ${{ inputs.publish }}
          CERTS: ${{ inputs.certs }}
          TESTFLIGHT: ${{ inputs.testflight }}
          REPLACE_SHOTS: ${{ inputs.reshoot }}
          APP_STORE_CREATIVE: ${{ inputs.creative }}
          APP_STORE_PROBE: ${{ inputs.probe }}
          IAP_STATUS: ${{ inputs.iap_status }}
          RELEASE_CHECK: ${{ inputs.release_check }}
          SAGE_SITE: https://sage.innotel.tech
          APP_STORE_SHOTS_PHONE: deploy/ios/store-phone
          APP_STORE_SHOTS: deploy/ios/store
          APP_STORE_SHOTS_IPAD: deploy/ios/store-ipad
          APP_STORE_SHOTS_DUO: deploy/ios/store-duo
          APPLE_REVIEW_PHONE: ${{ secrets.APPLE_REVIEW_PHONE }}
          # Guideline 2.1 asked for these in the review notes. The recording has to
          # be made on a physical device, so it arrives as a link rather than a file
          # in the repo; the account pair stays empty while the build needs no sign-in.
          APPLE_REVIEW_RECORDING_URL: ${{ secrets.APPLE_REVIEW_RECORDING_URL }}
          APPLE_REVIEW_DEMO_EMAIL: ${{ secrets.APPLE_REVIEW_DEMO_EMAIL }}
          APPLE_REVIEW_DEMO_PASSWORD: ${{ secrets.APPLE_REVIEW_DEMO_PASSWORD }}
        run: node scripts/asc-iap.mjs
