name: App Store Connect · session products

# The App Store Connect key is a repository secret, and GitHub never reads a secret
# back out. So the one-time product setup runs here rather than on a workstation.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the products for review (the first consumable needs an app version in the submission)
        type: boolean
        default: false
      listing:
        description: Fill the 1.0 listing, category, privacy URL, review contact and screenshots, then add the version to the draft
        type: boolean
        default: false
      attach:
        description: Attach the newest valid build to version 1.0 and add that version to the open submission
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create, price and localise the three session products
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: us.innotel.sage
          IAP_SCREENSHOT: deploy/ios/iap-review.png
          SUBMIT: ${{ inputs.submit }}
          ATTACH: ${{ inputs.attach }}
          LISTING: ${{ inputs.listing }}
          SAGE_SITE: https://sage.innotel.tech
          APP_STORE_SHOTS: deploy/ios/store
          APP_STORE_SHOTS_IPAD: deploy/ios/store-ipad
          APPLE_REVIEW_PHONE: ${{ secrets.APPLE_REVIEW_PHONE }}
        run: node scripts/asc-iap.mjs
