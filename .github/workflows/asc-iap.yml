name: App Store Connect · session products

# The App Store Connect key is a repository secret, and GitHub never reads a secret
# back out. So the one-time product setup runs here rather than on a workstation.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the products for review (the first consumable needs an app version in the submission)
        type: boolean
        default: false
      probe:
        description: Ask Apple what the Duo and Watch slots expect
        type: boolean
        default: false
      creative:
        description: Upload the header and search result creative into the asset library
        type: boolean
        default: false
      reshoot:
        description: Replace the screenshots even when the count is unchanged
        type: boolean
        default: false
      listing:
        description: Fill the 1.0 listing, category, privacy URL, review contact and screenshots, then add the version to the draft
        type: boolean
        default: false
      attach:
        description: Attach the newest valid build to version 1.0 and add that version to the open submission
        type: boolean
        default: false
      withdraw:
        description: Take version 1.0 out of review so a newer build can be attached
        type: boolean
        default: false
      publish:
        description: Submit the draft to App Review — the step that actually publishes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create, price and localise the three session products
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: us.innotel.sage
          IAP_SCREENSHOT: deploy/ios/iap-review.png
          SUBMIT: ${{ inputs.submit }}
          ATTACH: ${{ inputs.attach }}
          LISTING: ${{ inputs.listing }}
          WITHDRAW: ${{ inputs.withdraw }}
          PUBLISH: ${{ inputs.publish }}
          REPLACE_SHOTS: ${{ inputs.reshoot }}
          APP_STORE_CREATIVE: ${{ inputs.creative }}
          APP_STORE_PROBE: ${{ inputs.probe }}
          SAGE_SITE: https://sage.innotel.tech
          APP_STORE_SHOTS_PHONE: deploy/ios/store-phone
          APP_STORE_SHOTS: deploy/ios/store
          APP_STORE_SHOTS_IPAD: deploy/ios/store-ipad
          APP_STORE_SHOTS_DUO: deploy/ios/store-duo
          APPLE_REVIEW_PHONE: ${{ secrets.APPLE_REVIEW_PHONE }}
        run: node scripts/asc-iap.mjs
