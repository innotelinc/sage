# ci.yml — the checks this repository can actually make.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `config` parses the file, resolves env and fails on a bad reference —
      # the class of mistake that otherwise only shows up on a deploy.
      # compose declares `env_file: .env`, so the parse needs one to exist.
      # The template is the intended starting point; nothing secret is involved
      # in a syntax check.
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml config -q

  syntax:
    name: Server parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            node --check "$f"; n=$((n + 1))
          done < <(git ls-files '*.mjs' '*.js' | grep -v node_modules || true)
          echo "checked $n file(s)"
      - name: The entry point exists
        run: test -f server.mjs

  golden:
    name: Grounding is measured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The scorer is logic too: a wrong page must fail, an admitted gap must pass.
      - name: The scorer is checked
        run: node scripts/test-golden.mjs
      # Stubbed, so this costs nothing and still catches a prompt or citation
      # regression before a release tag.
      - name: The golden set does not regress
        run: node scripts/golden.mjs

  reader:
    name: The reader keeps its anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 6.0 is logic, not presentation: an anchor naming a document the course does
      # not hold, or an edit that overwrites the capture it sits beside, has to fail
      # here rather than on the page.
      - name: Anchors, sections and edits
        run: node scripts/test-reader.mjs
      - name: The session products still price correctly
        run: node scripts/test-iap.mjs
