name: iOS TestFlight

# TestFlight needs macOS + Xcode. This workflow is the route from this repo to
# App Store Connect with no Mac of your own. The Apple Distribution identity is
# stored as IOS_DIST_P12 + IOS_DIST_P12_PASSWORD and imported into a throwaway
# keychain here, so every run signs with the same certificate. Letting Xcode
# create one per run is what filled the account's certificate cap: a fresh runner
# has no private key for an existing certificate, so it mints another.
#
# Required repository secrets:
#   APPLE_TEAM_ID   10-character team id
#   ASC_KEY_ID      App Store Connect API key id
#   ASC_ISSUER_ID   App Store Connect issuer id
#   ASC_PRIVATE_KEY contents of AuthKey_<KEY_ID>.p8 (raw text)

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ASC API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "ASC_KEY_ID / ASC_PRIVATE_KEY secrets are missing"; exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import the distribution certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_DIST_P12" ] || [ -z "$IOS_DIST_P12_PASSWORD" ]; then
            echo "IOS_DIST_P12 / IOS_DIST_P12_PASSWORD secrets are missing"; exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/sage-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$IOS_DIST_P12" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/distribution.p12"
          echo "=== signing identities available to this run:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configure project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then echo "APPLE_TEAM_ID secret is missing"; exit 1; fi
          cp deploy/ios/capacitor.config.json capacitor.config.json
          npm install --no-audit --no-fund --no-save @capacitor/core @capacitor/cli @capacitor/ios
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
          echo "generated layout:"; ls -1 ios/App

      - name: Install app icon
        run: |
          # The Xcode project is generated fresh in this job, so it starts with whatever
          # icon Capacitor's template ships. Swap in Sage's catalog icon before the archive
          # so TestFlight and the App Store listing show the real mark.
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$(dirname "$ICONSET")"
          rm -rf "$ICONSET"
          cp -R deploy/ios/AppIcon.appiconset "$ICONSET"
          echo "icon slots: $(ls -1 "$ICONSET"/*.png | wc -l)"
          # An upload is rejected if the 1024 marketing icon carries alpha.
          if sips -g hasAlpha "$ICONSET/AppIcon-1024x1024@1x.png" | grep -q "hasAlpha: yes"; then
            echo "AppIcon-1024x1024@1x.png has an alpha channel"; exit 1
          fi

      - name: Merge usage descriptions into Info.plist
        run: |
          PLIST=ios/App/App/Info.plist
          set_key() { /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null \
                      || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"; }
          set_key NSMicrophoneUsageDescription "Sage listens to your lecture so it can follow along and answer questions."
          set_key NSCameraUsageDescription "Sage uses the camera to read slides and the whiteboard during class."
          set_key NSPhotoLibraryUsageDescription "Sage can read a photo of a slide or handout you choose to share."
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"

      - name: Add the screen-broadcast extension
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # An in-app recorder is suspended with the app, so the thing that keeps
          # recording in another app has to be a ReplayKit broadcast extension —
          # a second target, which the generated project does not have.
          mkdir -p ios/App/SageBroadcast
          cp deploy/ios/broadcast/SageBroadcast/SampleHandler.swift              deploy/ios/broadcast/SageBroadcast/Info.plist              deploy/ios/broadcast/SageBroadcast/SageBroadcast.entitlements              ios/App/SageBroadcast/
          cp deploy/ios/broadcast/SageBroadcastPlugin.swift ios/App/App/
          cp deploy/ios/broadcast/App.entitlements ios/App/App/App.entitlements
          IOS_MARKETING_VERSION=$(node -p "require('./package.json').version")             gem install xcodeproj --no-document > /dev/null
          IOS_MARKETING_VERSION=$(node -p "require('./package.json').version")             ruby deploy/ios/add-broadcast-target.rb
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" ios/App/SageBroadcast/Info.plist

      - name: Install native dependencies
        run: |
          # Capacitor 7 shipped a Podfile; Capacitor 8 (what we install) moved
          # iOS to Swift Package Manager and has none. Support both instead of
          # assuming CocoaPods.
          if [ -f ios/App/Podfile ]; then
            echo "CocoaPods project - running pod install"
            pod install --project-directory=ios/App
          else
            echo "No Podfile - SPM-based project, xcodebuild resolves packages"
          fi

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER="-workspace ios/App/App.xcworkspace"
          else
            CONTAINER="-project ios/App/App.xcodeproj"
          fi
          echo "building with $CONTAINER"
          xcodebuild \
            $CONTAINER \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Sage.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            archive

      - name: Verify the icon reached the app bundle
        run: |
          APP=build/Sage.xcarchive/Products/Applications/App.app
          ICONS=$(ls -1 "$APP" | grep -i '^AppIcon' | wc -l | tr -d " ")
          echo "compiled app icon resources: $ICONS"
          test "$ICONS" -ge 1 || { echo "no AppIcon resources were compiled into the app"; exit 1; }
          test -f "$APP/Assets.car"
          ls -1 "$APP" | grep -i '^AppIcon'

      - name: Verify the extension is inside the app
        run: |
          APP=build/Sage.xcarchive/Products/Applications/App.app
          EXTS=$(ls -1 "$APP/PlugIns" 2>/dev/null | wc -l | tr -d " ")
          echo "embedded extensions: $EXTS"
          ls -1 "$APP/PlugIns" 2>/dev/null || true
          test -d "$APP/PlugIns/SageBroadcast.appex" || { echo "the broadcast extension was not embedded"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier"             "$APP/PlugIns/SageBroadcast.appex/Info.plist"

      - name: Export .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed -i '' "s/REPLACE_TEAM_ID/${APPLE_TEAM_ID}/" deploy/ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Sage.xcarchive \
            -exportOptionsPlist deploy/ios/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose

      - name: Keep the archive for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-ios-archive
          path: |
            build/Sage.xcarchive
            build/ipa
          if-no-files-found: warn
