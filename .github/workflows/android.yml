name: Android APK

# Free signing, on purpose: assembleDebug is signed with the debug keystore that
# Gradle generates on the runner, so the APK installs on any device without a
# Play Store account or a certificate of your own. It is not a Play-ready
# release — for that, add a keystore and switch to assembleRelease.
#
# Actions -> Android APK -> Run workflow, or push a tag app-v*.
#
# No android-actions/setup-android here: v3 fails on current runners with
# "Failed to find package 'tools'". The ubuntu image already carries the SDK and
# its licences, so the build just points Gradle at it.

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Inspect the preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk at $SDK"
          ls "$SDK/platforms" 2>/dev/null | tail -3
          ls "$SDK/build-tools" 2>/dev/null | tail -3

      - name: Add the Android platform
        run: |
          cp deploy/android/capacitor.config.json capacitor.config.json
          npm install --no-audit --no-fund --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          echo "generated:"; ls -1 android/app/src/main

      - name: Add the app's own screen-capture plugin
        run: |
          mkdir -p android/app/src/main/java/us/innotel/sage
          cp deploy/android/native/SageScreenPlugin.java              deploy/android/native/SageScreenService.java              deploy/android/native/MainActivity.java              android/app/src/main/java/us/innotel/sage/
          ls -1 android/app/src/main/java/us/innotel/sage

      - name: Merge the permissions the app uses
        run: node deploy/android/merge-manifest.mjs

      - name: Assemble the debug-signed APK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the artefact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/*.apk "dist/android/Sage-${VERSION}.apk"
          ls -lh dist/android

      - uses: actions/upload-artifact@v4
        with:
          name: sage-android-apk
          path: dist/android/*.apk
          if-no-files-found: error
